services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: aisehack:latest
    container_name: aisehack-web
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    # Persist the categorization cache / batch-send audit log / imported
    # team data across rebuilds -- without this, .mail-ops-cache lived
    # only inside the container's own filesystem and was silently wiped
    # by every `docker compose up --build` (every fix tonight included).
    volumes:
      - ./.mail-ops-cache:/app/.mail-ops-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
