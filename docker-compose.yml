services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: aisehack:latest
    container_name: aisehack-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
